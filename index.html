<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOXEL RALLY</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0d10; }
  #c { display: block; width: 100vw; height: 100vh; }
  /* DEV overlay (physics read-out, key H) — deliberately a different animal from the
     game HUD: monospace, hairline dashed frame, its own label, dimmer, z-order under
     #rally, so a screenshot can never be read as "the game UI is a text wall". */
  #hud {
    position: fixed; inset: 0; pointer-events: none; z-index: 2; display: none;
    font: 11px/1.3 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: #8fa3b0; text-shadow: 0 1px 2px rgba(0,0,0,.85);
  }
  #hud .panel {
    position: absolute; padding: 8px 10px; border-radius: 2px;
    background: rgba(6,8,10,.42); border: 1px dashed rgba(255,138,92,.35);
    white-space: pre; max-width: 34vw;
  }
  #hud .panel::before {
    content: "DEV · FIZYKA"; display: block; margin-bottom: 4px;
    color: #ff8a5c; letter-spacing: .18em; font-size: 9px;
  }
  #hud-tl { top: 10px; left: 10px; }
  #hud-tr { top: 10px; right: 10px; text-align: right; }
  #hud-bl { bottom: 10px; left: 10px; }
  #hud-br { bottom: 10px; right: 10px; text-align: right; }
  /* The DEV read-out is opt-in: src/debug/hud.js adds .on (?debug=1 or key H), so it
     is never in the way of the pixel strip or a touch pad by default. On a phone it
     keeps to the upper half for the same reason. */
  #hud.on { display: block; }
  @media (max-width: 760px), (max-height: 620px) {
    #hud { font-size: 10px; }
    #hud .panel { max-width: 46vw; padding: 6px 8px; }
    #hud-bl, #hud-br { bottom: auto; top: 46vh; }
    #hud-br { text-align: left; }
  }
  /* Rally HUD — Colin McRae Rally OBJECTS drawn in Minecraft's VISUAL LANGUAGE
     (PLAN.md §10 + §10.1). The whole HUD is one canvas drawn with integer coordinates
     and nearest-neighbour scaling: no gradients, no blur, no rounded corners, no alpha
     panels, no CSS filter, no system font. Layout stays anchor-based (corners), the
     canvas is a whole-integer upscale of a logical GUI buffer and every panel honours
     the safe area (skills/game-ui-ux #1-#3): the insets are read from #rly-safe. */
  #rally {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
  }
  #rally .rly-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  /* safe-area probe: the HUD reads its insets from this element's computed padding */
  #rly-safe {
    position: fixed; top: 0; left: 0; width: 0; height: 0; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
             env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }
  /* Screen-state stack (skill #5): the modal owns focus. Its text is pixel-drawn on the
     canvas; these DOM rows are the keyboard/gamepad/mouse focus targets, laid over the
     drawn rows, so the menu never needs a system font. */
  #rally .rly-modal { position: absolute; inset: 0; display: none; pointer-events: none; touch-action: manipulation; }
  #rally .rly-modal.open { display: block; pointer-events: auto; }
  /* Hit area of a menu row. The visible button is pixel-drawn on the canvas; this DOM
     box is the touch/mouse target and is never smaller than 72 CSS px in either axis
     (WCAG 2.5.5), so on a phone the drawn row is centred inside a taller box. */
  #rally .menu-item {
    position: absolute; padding: 0; border: 0; background: none;
    min-width: 72px; min-height: 72px;
    font-size: 1px; line-height: 1px; color: transparent; cursor: pointer;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  }
  #rally .menu-item.off { display: none; }
  /* Visible focus is drawn by the canvas (a blue ring inside the raised row): the DOM
     box is a >= 72 CSS px hit target and is taller than the drawn row, so a DOM
     outline here would ring the neighbour row instead. */
  #rally .menu-item.focus { outline: none; }
  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    font: 14px/1.5 ui-monospace, monospace; color: #9fb0ba; background: #0b0d10;
  }
  #boot.hidden { display: none; }
  .warn { color: #ffb37a; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="panel" id="hud-tl"></div>
  <div class="panel" id="hud-tr"></div>
  <div class="panel" id="hud-bl"></div>
  <div class="panel" id="hud-br"></div>
</div>
<div id="rally" class="rally mode-full"></div>
<div id="rly-safe"></div>
<div id="boot">VOXEL RALLY — generowanie odcinka…</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
